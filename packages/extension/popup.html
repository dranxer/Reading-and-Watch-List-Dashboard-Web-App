<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ReadWatch</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 380px;
            min-height: 500px;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f8fafc;
            color: #1e293b;
        }

        .header {
            background: linear-gradient(135deg, #0F766E, #115E59);
            color: white;
            padding: 16px;
            text-align: center;
        }

        .header h1 {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 4px;
        }

        .header p {
            font-size: 12px;
            opacity: 0.9;
        }

        .auth-status {
            background: white;
            margin: 12px;
            padding: 12px;
            border-radius: 8px;
            border: 2px solid #e2e8f0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }

        .auth-status.authenticated {
            border-color: #22c55e;
            background: #f0fdf4;
        }

        .auth-status.not-authenticated {
            border-color: #f59e0b;
            background: #fffbeb;
        }

        .auth-actions {
            display: flex;
            gap: 8px;
        }

        .btn {
            background: #0F766E;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn:hover {
            background: #115E59;
        }

        .btn-secondary {
            background: #6b7280;
        }

        .btn-secondary:hover {
            background: #4b5563;
        }

        .btn-success {
            background: #22c55e;
        }

        .btn-success:hover {
            background: #16a34a;
        }

        .btn-warning {
            background: #f59e0b;
        }

        .btn-warning:hover {
            background: #d97706;
        }

        .content {
            padding: 16px;
        }

        .section {
            margin-bottom: 24px;
        }

        .section h2 {
            font-size: 14px;
            font-weight: 600;
            color: #374151;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
        }

        .stat-item {
            background: white;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 12px 8px;
            text-align: center;
            transition: all 0.2s;
        }

        .stat-item:hover {
            border-color: #0F766E;
            transform: translateY(-1px);
        }

        .stat-number {
            font-size: 20px;
            font-weight: 700;
            color: #0F766E;
            line-height: 1;
        }

        .stat-date {
            font-size: 11px;
            font-weight: 600;
            color: #059669;
            line-height: 1;
        }

        .stat-label {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }

        .items-container {
            max-height: 250px;
            overflow-y: auto;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: white;
        }

        .item {
            padding: 12px;
            border-bottom: 1px solid #f1f5f9;
            position: relative;
        }

        .item:last-child {
            border-bottom: none;
        }

        .item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 6px;
        }

        .item-title {
            font-size: 13px;
            font-weight: 500;
            color: #1e293b;
            line-height: 1.3;
            flex: 1;
            margin-right: 8px;
            overflow: hidden;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
        }

        .item-score {
            font-size: 11px;
            font-weight: 600;
            color: #059669;
            background: #ecfdf5;
            padding: 2px 6px;
            border-radius: 4px;
            white-space: nowrap;
        }

        .item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .item-domain {
            font-size: 11px;
            color: #64748b;
            font-weight: 500;
        }

        .item-date {
            font-size: 11px;
            color: #94a3b8;
        }

        .item-stats {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .stat {
            font-size: 10px;
            color: #64748b;
            background: #f1f5f9;
            padding: 2px 6px;
            border-radius: 3px;
        }

        .stat.type-article {
            background: #dbeafe;
            color: #115E59;
        }

        .stat.type-video {
            background: #fef3c7;
            color: #d97706;
        }

        .stat.type-blog {
            background: #e0e7ff;
            color: #6366f1;
        }

        .item-actions {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .item-actions .btn {
            font-size: 10px;
            padding: 4px 8px;
        }

        .sync-status {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #94a3b8;
        }

        .sync-status.synced {
            background: #22c55e;
        }

        .summary-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 8px;
            margin-top: 6px;
            font-size: 11px;
            color: #475569;
            line-height: 1.4;
            display: none;
        }

        .summary-box.show {
            display: block;
        }

        .loading, .error, .empty-state {
            text-align: center;
            padding: 24px;
            color: #64748b;
            font-size: 13px;
        }

        .error {
            color: #dc2626;
        }

        .empty-state {
            color: #94a3b8;
        }

        .footer {
            padding: 12px 16px;
            background: white;
            border-top: 1px solid #e2e8f0;
            display: flex;
            gap: 8px;
        }

        .footer .btn {
            flex: 1;
            text-align: center;
        }

        .clear-button {
            background: #dc2626;
        }

        .clear-button:hover {
            background: #b91c1c;
        }

        .clear-button:disabled {
            background: #9ca3af;
            cursor: not-allowed;
        }

        .dashboard-button {
            background: #059669;
        }

        .dashboard-button:hover {
            background: #047857;
        }

        .notification {
            position: fixed;
            top: 10px;
            right: 10px;
            background: #059669;
            color: white;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            z-index: 10000;
            transform: translateX(100%);
            transition: transform 0.3s ease;
        }

        .notification.show {
            transform: translateX(0);
        }

        .notification.error {
            background: #dc2626;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 8px;
            padding: 20px;
            max-width: 300px;
            width: 90%;
        }

        .modal h3 {
            margin-bottom: 12px;
            font-size: 16px;
        }

        .modal input, .modal select {
            width: 100%;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            margin-bottom: 12px;
            font-size: 14px;
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            justify-content: flex-end;
        }

        /* Scrollbar styling */
        .items-container::-webkit-scrollbar {
            width: 4px;
        }

        .items-container::-webkit-scrollbar-track {
            background: #f1f5f9;
        }

        .items-container::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 2px;
        }

        .items-container::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
        .tracking { margin: 0 12px 12px; padding: 12px; border-radius: 8px; background: white; border: 1px solid #d5e3e1; font-size: 13px; }
        .tracking p { color: #334155; line-height: 1.45; }
        .tracking .row { display: flex; gap: 8px; margin-top: 10px; }
        .tracking-toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; cursor: pointer; }
        .tracking-toggle small { display: block; color: #64748b; font-size: 12px; margin-top: 2px; }
        .switch { appearance: none; width: 36px; height: 20px; border-radius: 10px; background: #cbd5e1; position: relative; cursor: pointer; flex: none; transition: background .15s; }
        .switch::after { content: ''; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: white; transition: transform .15s; }
        .switch:checked { background: #0F766E; }
        .switch:checked::after { transform: translateX(16px); }
        .switch:focus-visible { outline: 2px solid #0F766E; outline-offset: 2px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>ReadWatch</h1>
        <p>Your reading & watching companion</p>
    </div>

    <div id="authStatus" class="auth-status">
        <span id="authText">Checking authentication...</span>
        <div class="auth-actions">
            <button id="refreshAuth" class="btn btn-secondary" title="Refresh">↻</button>
        </div>
    </div>

    <div id="trackingPrompt" class="tracking" hidden>
        <p><b>Turn on ReadWatch?</b> It offers to save the articles and videos you read. Nothing is saved until you click Save.</p>
        <div class="row">
            <button id="trackingOn" class="btn">Turn on</button>
            <button id="trackingOff" class="btn btn-secondary">Not now</button>
        </div>
    </div>
    <label id="trackingToggle" class="tracking tracking-toggle" hidden>
        <span><b>Offer to save pages</b><small id="trackingHint">Asks before saving anything</small></span>
        <input type="checkbox" id="trackingSwitch" class="switch" role="switch">
    </label>

    <div class="content">
        <div class="section">
            <h2>▣ Statistics</h2>
            <div id="stats" class="stats-grid">
                <div class="loading">Loading...</div>
            </div>
        </div>

        <div class="section">
            <h2>▤ Recent Items</h2>
            <div id="items" class="items-container">
                <div class="loading">Loading...</div>
            </div>
        </div>
    </div>

    <div class="footer">
        <button id="openDashboard" class="btn dashboard-button">→ Dashboard</button>
        <button id="clearData" class="btn clear-button">✕ Clear</button>
    </div>

    <!-- List Selection Modal -->
    <div id="listModal" class="modal">
        <div class="modal-content">
            <h3>Add to List</h3>
            <select id="listSelect">
                <option value="">Select a list...</option>
            </select>
            <input type="text" id="newListName" placeholder="Or create new list..." />
            <div class="modal-actions">
                <button id="cancelAddToList" class="btn btn-secondary">Cancel</button>
                <button id="confirmAddToList" class="btn">Add</button>
            </div>
        </div>
    </div>

    <script src="popup.js"></script>
</body>
</html>
