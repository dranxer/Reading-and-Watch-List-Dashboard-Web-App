<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>CurioLog Simple</title>
    <style>
        body {
            width: 300px;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 5px;
            background: #f0f0f0;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
            border: none;
            border-radius: 4px;
            background: #007cba;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #005a87;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div style="text-align: center; margin-bottom: 20px;">
        <h3 style="margin: 0; color: #333;">🔍 CurioLog</h3>
        <p style="margin: 5px 0; color: #666; font-size: 12px;">Knowledge Tracker Extension</p>
    </div>
    
    <div id="status" class="status">
        Checking connection...
    </div>
    
    <div id="authSection">
        <button id="authBtn">🔑 Sign In to Knowledge Tracker</button>
        <button id="logoutBtn" style="display: none;">🚪 Sign Out</button>
    </div>
    
    <div style="margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee;">
        <details>
            <summary style="cursor: pointer; font-size: 12px; color: #666;">Debug Tools</summary>
            <div style="margin-top: 10px;">
                <button id="pingBtn" style="font-size: 12px; padding: 8px;">Test Connection</button>
                <button id="statusBtn" style="font-size: 12px; padding: 8px;">Get Status</button>
            </div>
        </details>
    </div>
    
    <div id="result" class="status" style="display: none; font-size: 12px;"></div>
    
    <script src="popup-simple.js"></script>
</body>
</html>
