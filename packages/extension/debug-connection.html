<!DOCTYPE html>
<html>
<head>
    <title>CurioLog Connection Debug</title>
    <style>
        body { 
            font-family: monospace; 
            padding: 20px; 
            max-width: 800px; 
            margin: 0 auto;
        }
        .log { 
            background: #f5f5f5; 
            padding: 10px; 
            margin: 5px 0; 
            border-radius: 4px; 
            border-left: 4px solid #ccc;
        }
        .error { 
            background: #ffe6e6; 
            border-left-color: #ff0000;
        }
        .success { 
            background: #e6ffe6; 
            border-left-color: #00aa00;
        }
        .warning {
            background: #fff3cd;
            border-left-color: #ffc107;
        }
        button { 
            padding: 10px 20px; 
            margin: 5px; 
            border: none;
            border-radius: 4px;
            background: #007cba;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background: #005a87;
        }
        .section {
            margin: 20px 0;
            padding: 15px;
            border: 1px solid #ddd;
            border-radius: 8px;
        }
        .status-indicator {
            display: inline-block;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin-right: 8px;
        }
        .status-ok { background: #28a745; }
        .status-error { background: #dc3545; }
        .status-warning { background: #ffc107; }
    </style>
</head>
<body>
    <h1>🔧 CurioLog Connection Diagnostics</h1>
    
    <div class="section">
        <h3>Extension Detection</h3>
        <p>
            <span class="status-indicator" id="extensionDetected"></span>
            <span id="extensionStatus">Checking...</span>
        </p>
        <p><strong>Extension ID:</strong> <span id="extensionId">Unknown</span></p>
    </div>

    <div class="section">
        <h3>Quick Tests</h3>
        <button id="testBasicBtn">Test Basic Connection</button>
        <button id="testPingBtn">Test Ping</button>
        <button id="testStatusBtn">Test Get Status</button>
        <button id="clearLogsBtn">Clear Logs</button>
    </div>

    <div class="section">
        <h3>Advanced Tests</h3>
        <button onclick="inspectBackground()">Inspect Background</button>
        <button onclick="reloadExtension()">Reload Extension</button>
        <button onclick="showStorageData()">Show Storage</button>
        <button onclick="testAllEndpoints()">Test All Endpoints</button>
    </div>

    <div class="section">
        <h3>Debug Log</h3>
        <div id="logs"></div>
    </div>

    <script>
        function log(message, type = 'log') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.innerHTML = `<strong>[${new Date().toLocaleTimeString()}]</strong> ${message}`;
            logs.appendChild(div);
            logs.scrollTop = logs.scrollHeight;
            console.log(`[${type.toUpperCase()}] ${message}`);
        }

        function updateExtensionStatus() {
            const indicator = document.getElementById('extensionDetected');
            const status = document.getElementById('extensionStatus');
            const idSpan = document.getElementById('extensionId');
            
            if (typeof chrome !== 'undefined' && chrome.runtime) {
                indicator.className = 'status-indicator status-ok';
                status.textContent = 'Extension API Available';
                idSpan.textContent = chrome.runtime.id || 'Available';
                log('✅ Chrome extension API detected', 'success');
            } else {
                indicator.className = 'status-indicator status-error';
                status.textContent = 'Extension API Not Available';
                idSpan.textContent = 'Not Available';
                log('❌ Chrome extension API not available', 'error');
            }
        }

        async function testBasicConnection() {
            log('🔧 Testing basic connection...', 'log');
            
            if (!chrome.runtime) {
                log('❌ Chrome runtime not available', 'error');
                return;
            }

            try {
                // Try to check if the runtime is valid
                const id = chrome.runtime.id;
                log(`✅ Runtime ID: ${id}`, 'success');
                
                // Try a simple message
                const response = await new Promise((resolve, reject) => {
                    const timeout = setTimeout(() => {
                        reject(new Error('Timeout after 5 seconds'));
                    }, 5000);
                    
                    chrome.runtime.sendMessage({ type: 'BASIC_TEST' }, (response) => {
                        clearTimeout(timeout);
                        if (chrome.runtime.lastError) {
                            reject(new Error(chrome.runtime.lastError.message));
                        } else {
                            resolve(response);
                        }
                    });
                });
                
                log(`✅ Basic connection successful: ${JSON.stringify(response)}`, 'success');
                
            } catch (error) {
                log(`❌ Basic connection failed: ${error.message}`, 'error');
                
                // Suggest solutions
                if (error.message.includes('receiving end does not exist')) {
                    log('💡 Solution: Background script might not be loaded. Try reloading the extension.', 'warning');
                } else if (error.message.includes('Timeout')) {
                    log('💡 Solution: Background script might be stuck. Check background console for errors.', 'warning');
                }
            }
        }

        async function testPing() {
            log('🏓 Testing ping...', 'log');
            
            try {
                const response = await chrome.runtime.sendMessage({ type: 'PING' });
                log(`🏓 Ping response: ${JSON.stringify(response)}`, 'success');
            } catch (error) {
                log(`❌ Ping failed: ${error.message}`, 'error');
            }
        }

        async function testGetStatus() {
            log('📊 Testing get status...', 'log');
            
            try {
                const response = await chrome.runtime.sendMessage({ type: 'GET_STATUS' });
                log(`📊 Status response: ${JSON.stringify(response, null, 2)}`, 'success');
            } catch (error) {
                log(`❌ Get status failed: ${error.message}`, 'error');
            }
        }

        function inspectBackground() {
            log('🔍 Opening background script inspector...', 'log');
            log('💡 Go to chrome://extensions/ → CurioLog Details → Inspect views: background page', 'warning');
            window.open('chrome://extensions/');
        }

        function reloadExtension() {
            log('🔄 To reload extension: Go to chrome://extensions/ and click the reload button', 'warning');
            window.open('chrome://extensions/');
        }

        async function showStorageData() {
            log('📦 Checking extension storage...', 'log');
            
            if (chrome.storage) {
                try {
                    const data = await chrome.storage.local.get();
                    log(`📦 Storage data: ${JSON.stringify(data, null, 2)}`, 'success');
                } catch (error) {
                    log(`❌ Storage error: ${error.message}`, 'error');
                }
            } else {
                log('❌ Storage API not available', 'error');
            }
        }

        async function testAllEndpoints() {
            log('🧪 Testing all endpoints...', 'log');
            
            const endpoints = ['PING', 'GET_STATUS', 'SET_API_URL'];
            
            for (const endpoint of endpoints) {
                try {
                    const message = endpoint === 'SET_API_URL' 
                        ? { type: endpoint, url: 'http://localhost:3000' }
                        : { type: endpoint };
                        
                    const response = await chrome.runtime.sendMessage(message);
                    log(`✅ ${endpoint}: ${JSON.stringify(response)}`, 'success');
                } catch (error) {
                    log(`❌ ${endpoint}: ${error.message}`, 'error');
                }
                
                // Small delay between tests
                await new Promise(resolve => setTimeout(resolve, 100));
            }
        }

        function clearLogs() {
            document.getElementById('logs').innerHTML = '';
        }

        // Auto-run on load
        window.addEventListener('load', () => {
            log('🚀 Diagnostic page loaded');
            updateExtensionStatus();
            
            // Auto-test basic connection after 1 second
            setTimeout(testBasicConnection, 1000);
        });

        // Listen for any messages from background
        if (typeof chrome !== 'undefined' && chrome.runtime) {
            chrome.runtime.onMessage.addListener((message, sender, sendResponse) => {
                log(`📨 Received message: ${JSON.stringify(message)}`, 'warning');
                return true;
            });
        }
    </script>
</body>
</html>
