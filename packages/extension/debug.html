<!DOCTYPE html>
<html>
<head>
    <title>CurioLog Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; }
        .log { background: #f0f0f0; padding: 10px; margin: 5px 0; border-radius: 4px; }
        .error { background: #ffe6e6; }
        .success { background: #e6ffe6; }
        button { padding: 10px; margin: 5px; }
    </style>
</head>
<body>
    <h1>CurioLog Extension Debug</h1>
    
    <button id="testConnection">Test Connection</button>
    <button id="getStatus">Get Status</button>
    <button id="testAuth">Test Auth</button>
    <button id="clearLogs">Clear Logs</button>
    
    <div id="logs"></div>

    <script>
        function log(message, type = 'log') {
            const logs = document.getElementById('logs');
            const div = document.createElement('div');
            div.className = `log ${type}`;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logs.appendChild(div);
            console.log(message);
        }

        document.getElementById('testConnection').addEventListener('click', async () => {
            log('Testing connection...');
            try {
                const response = await chrome.runtime.sendMessage({ type: 'PING' });
                log(`Connection test result: ${JSON.stringify(response)}`, 'success');
            } catch (error) {
                log(`Connection error: ${error.message}`, 'error');
            }
        });

        document.getElementById('getStatus').addEventListener('click', async () => {
            log('Getting status...');
            try {
                const response = await chrome.runtime.sendMessage({ type: 'GET_STATUS' });
                log(`Status: ${JSON.stringify(response, null, 2)}`, 'success');
            } catch (error) {
                log(`Status error: ${error.message}`, 'error');
            }
        });

        document.getElementById('testAuth').addEventListener('click', async () => {
            log('Testing authentication...');
            try {
                const response = await chrome.runtime.sendMessage({ type: 'AUTHENTICATE' });
                log(`Auth result: ${JSON.stringify(response)}`, 'success');
            } catch (error) {
                log(`Auth error: ${error.message}`, 'error');
            }
        });

        document.getElementById('clearLogs').addEventListener('click', () => {
            document.getElementById('logs').innerHTML = '';
        });

        // Auto-test on load
        window.addEventListener('load', () => {
            log('Debug page loaded');
            log(`Chrome runtime available: ${!!chrome.runtime}`);
            log(`Extension ID: ${chrome.runtime?.id || 'undefined'}`);
        });
    </script>
</body>
</html>
