<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Reading & Watch List</title>
  <style>
    body {
      width: 400px;
      min-height: 500px;
      margin: 0;
      padding: 16px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      color: #333;
    }

    h1 {
      font-size: 1.5rem;
      margin: 0 0 16px;
      color: #1a73e8;
    }

    #status-text {
      text-align: center;
      color: #666;
      padding: 20px;
    }

    #history-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .history-item {
      padding: 12px;
      border-bottom: 1px solid #eee;
    }

    .history-item:last-child {
      border-bottom: none;
    }

    .item-header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }

    .type-icon {
      font-size: 1.2rem;
    }

    .title {
      flex: 1;
      color: #1a73e8;
      text-decoration: none;
      font-weight: 500;
    }

    .title:hover {
      text-decoration: underline;
    }

    .date {
      color: #666;
      font-size: 0.9rem;
    }

    .summary {
      margin: 0;
      font-size: 0.9rem;
      color: #444;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h1>Reading & Watch List</h1>
  <div id="status-text">Loading...</div>
  <ul id="history-list"></ul>
  <script src="dist/popup.js"></script>
</body>
</html>
